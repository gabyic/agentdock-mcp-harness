name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify

      - name: Test
        run: npm test

      - name: v0.1 black-box acceptance
        run: npm run acceptance:v0.1

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify systemd service contract
        run: npm run service:verify

      - name: Build reproducible release artifact
        run: npm run release:build

      - name: Verify release checksum
        run: cd dist && sha256sum -c *.sha256

      - name: Smoke release archive
        run: npm run release:smoke
